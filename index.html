<html>
    <head>
        <title>
            Web Minesweeper
        </title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
    </head>
    <body id="body">
        <div id="timer">
            v1.0.18
        </div>
        <div id="modechanger" class="square tile">
            X
        </div>
        <div id="scaleup" class="square tile">
            +
        </div>
        <div id="scaledown" class="square tile">
            -
        </div>
        <div id="up" class="small tile">
            ↑
        </div>
        <div id="down" class="small tile">
            ↓
        </div>
        <div id="left" class="small tile">
            ←
        </div>
        <div id="right" class="small tile">
            →
        </div>
        <div id="config">
            <span>
                Width: 
            </span>
            <input value="25" type="number" id="Iwidth"> 

            </input>
            <br>
            <span>
                Height: 
            </span>
            <input value="25" type="number" id="Iheight"> 

            </input>
            <br>
            <span>
                Mines: 
            </span>
            <input value="120" type="number" id="Imines"> 

            </input>
            <br>
            <span>
                Mine Range: 
            </span>
            <input value="1.5" type="number" id="Imdr"> 

            </input>
            <br>
            <div id="randomizer">
                Randomize
            </div>
            <div id="start">
                Start
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
